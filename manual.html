<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual · Saneamento de MAPPs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Paleta, tipografia e componentes copiados de index.html, para o manual ter a mesma aparência do sistema. */
:root{
  --papel:#f3f1ec; --papel-2:#e9e6e0; --carta:#fffefc; --carta-2:#faf8f4;
  --tinta:#1c1f23; --tinta-2:#4a5058; --tinta-3:#737a83;
  --linha:#d9d4cb; --linha-forte:#c1bab0;
  --grafite:#3f4750; --latao:#8d7130; --musgo:#4c6847; --ardosia:#3f5c78;
  --ferrugem:#8a5240; --ameixa:#655070; --ocre:#867123; --carmim:#8b3a3a; --petroleo:#2f5f61; --sepia:#6f5a43;
  --ok:#4c6847; --alerta:#867123; --risco:#8b3a3a; --neutro:#737a83;
  --sombra:0 1px 1px rgba(28,31,35,.05), 0 10px 26px -18px rgba(28,31,35,.35);
  --sombra-alta:0 24px 60px -24px rgba(28,31,35,.45);
  --raio:12px; --raio-p:7px;
  --acento:var(--grafite); --acento-tenue:rgba(63,71,80,.09); --acento-medio:rgba(63,71,80,.30);
}
html[data-tema="escuro"]{
  --papel:#14171b; --papel-2:#1a1e23; --carta:#1f242a; --carta-2:#242a31;
  --tinta:#e9e6e0; --tinta-2:#bab5ac; --tinta-3:#8d949d;
  --linha:#2e343b; --linha-forte:#3e454e;
  --grafite:#9fa9b4; --latao:#c4a45e; --musgo:#87ab7f; --ardosia:#7ba3c8;
  --ferrugem:#c68a74; --ameixa:#ab92b8; --ocre:#c0aa4e; --carmim:#cf7d7d; --petroleo:#64a7a9; --sepia:#c0a281;
  --ok:#87ab7f; --alerta:#c0aa4e; --risco:#cf7d7d; --neutro:#8d949d;
  --sombra:0 1px 1px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
  --sombra-alta:0 24px 60px -24px rgba(0,0,0,.9);
}

html,body{margin:0;padding:0}
body{
  background:var(--papel); color:var(--tinta);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"IBM Plex Serif",Georgia,serif; font-weight:600; letter-spacing:-.01em; margin:0}
h1{font-size:19px} h2{font-size:17px} h3{font-size:15px} h4{font-size:13.5px}
p{margin:0 0 10px}
a{color:var(--ardosia)}
.mono,.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.tenue{color:var(--tinta-3)}
.pequeno{font-size:12px}
.minusculo{font-size:11px}
hr.divisa{border:0;border-top:1px solid var(--linha);margin:16px 0}

/* ---------- Cabeçalho ---------- */
.topo{
  position:sticky; top:0; z-index:40; background:var(--carta);
  border-bottom:1px solid var(--linha); box-shadow:var(--sombra);
}
.topo-linha{display:flex; align-items:center; gap:16px; padding:10px 20px}
.brasao{
  width:34px;height:34px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(150deg,var(--grafite),var(--ardosia));
  display:grid;place-items:center;color:#fff;font-family:"IBM Plex Serif",serif;font-weight:600;font-size:15px;
}
html[data-tema="escuro"] .brasao{color:#14171b}
.titulo-bloco{display:flex;flex-direction:column;line-height:1.25}
.titulo-bloco .sub{font-size:11.5px;color:var(--tinta-3)}
.topo-acoes{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.selo-base{
  display:flex;align-items:center;gap:8px;padding:5px 11px;border:1px solid var(--linha);
  border-radius:99px;background:var(--carta-2);font-size:12px;color:var(--tinta-2);
}
.selo-base .pt{width:7px;height:7px;border-radius:50%;background:var(--neutro)}
.selo-base.ativa .pt{background:var(--ok)}

/* ---------- Abas ---------- */
.abas{display:flex;gap:2px;padding:0 14px;overflow-x:auto;background:var(--carta);border-bottom:1px solid var(--linha)}
.aba{
  appearance:none;border:0;background:transparent;cursor:pointer;white-space:nowrap;
  font-family:inherit;font-size:13px;color:var(--tinta-3);padding:9px 13px 8px;
  border-bottom:2px solid transparent;border-radius:var(--raio-p) var(--raio-p) 0 0;display:flex;gap:7px;align-items:center;
}
.aba:hover{color:var(--tinta);background:var(--papel-2)}
.aba .ponto{width:8px;height:8px;border-radius:2px;background:var(--cor);opacity:.55}
.aba[aria-selected="true"]{color:var(--cor);border-bottom-color:var(--cor);font-weight:600;background:var(--carta)}
.aba[aria-selected="true"] .ponto{opacity:1}
.aba:disabled{opacity:.4;cursor:not-allowed}
.aba:focus-visible{outline:2px solid var(--ardosia);outline-offset:-2px}

main{padding:20px; max-width:1560px; margin:0 auto}

.gaveta.estreita{width:min(660px,96vw)}
section[role="tabpanel"]{animation:surgir .18s ease-out}
@keyframes surgir{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Blocos ---------- */
.bloco{
  background:var(--carta); border:1px solid var(--linha); border-left:3px solid var(--acento);
  border-radius:var(--raio); box-shadow:var(--sombra); padding:16px 18px; margin-bottom:16px;
}
.bloco > header{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.bloco > header h2, .bloco > header h3{color:var(--acento)}
.bloco > header .legenda{font-size:12px;color:var(--tinta-3);margin-left:auto}
.bloco.tenor-alerta{border-left-color:var(--alerta)}
.bloco.tenor-risco{border-left-color:var(--risco)}
.grade{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ---------- Cartões de indicador ---------- */
.cartoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px}
.cartao{
  position:relative;background:var(--carta);border:1px solid var(--linha);border-radius:var(--raio);
  padding:13px 14px 12px;box-shadow:var(--sombra);
}
.cartao::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--cor,var(--neutro));
  border-radius:var(--raio) 0 0 var(--raio)}
.cartao .rotulo{font-size:11.5px;color:var(--tinta-3);display:flex;align-items:center;gap:6px}
.cartao .valor{font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:500;letter-spacing:-.02em;margin-top:3px;color:var(--cor,var(--tinta))}
.cartao .valor.reduzido{font-size:17px}
.cartao .nota{font-size:11.5px;color:var(--tinta-3);margin-top:3px}
.cartao.clicavel{cursor:pointer;transition:border-color .15s}
.cartao.clicavel:hover{border-color:var(--cor)}
.btn{
  appearance:none;border:1px solid var(--linha-forte);background:var(--carta);color:var(--tinta);
  padding:7px 13px;border-radius:var(--raio-p);cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:background .14s,border-color .14s,color .14s;
}
.btn:hover{background:var(--papel-2);border-color:var(--acento)}
.btn:focus-visible{outline:2px solid var(--ardosia);outline-offset:1px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.principal{background:var(--acento);border-color:var(--acento);color:var(--carta)}
html[data-tema="escuro"] .btn.principal{color:#14171b}
.btn.principal:hover{filter:brightness(1.08)}
.btn.discreto{border-color:transparent;background:transparent;color:var(--tinta-2);padding:5px 8px}
.btn.discreto:hover{background:var(--papel-2);color:var(--tinta)}
.btn.risco{border-color:var(--risco);color:var(--risco)}
.btn.pequeno{padding:4px 9px;font-size:12px}
.barra-acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* ---------- Etiquetas ---------- */
.etq{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11.5px;
  border:1px solid var(--cor,var(--linha-forte)); color:var(--cor,var(--tinta-2)); background:transparent; white-space:nowrap;
}
.etq.solida{background:var(--cor);color:var(--carta);border-color:var(--cor)}
.tabela-caixa{overflow:auto;border:1px solid var(--linha);border-radius:var(--raio);background:var(--carta);max-height:64vh}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{
  position:sticky;top:0;z-index:2;background:var(--papel-2);color:var(--tinta-2);text-align:left;
  padding:8px 10px;border-bottom:1px solid var(--linha-forte);font-weight:600;font-size:11.5px;white-space:nowrap;
}
thead th.ordenavel{cursor:pointer;user-select:none;position:relative}
thead th.ordenavel:hover{color:var(--acento)}
thead th.ordenavel::after{content:"⇅";font-size:9px;opacity:.28;margin-left:5px}
thead th[data-dir="asc"]{color:var(--acento)}
thead th[data-dir="desc"]{color:var(--acento)}
thead th[data-dir="asc"]::after{content:"↑";opacity:.95;font-size:10px}
thead th[data-dir="desc"]::after{content:"↓";opacity:.95;font-size:10px}
tbody td{padding:7px 10px;border-bottom:1px solid var(--linha);vertical-align:top}
tbody tr:hover{background:var(--acento-tenue)}
/* ---------- Avisos ---------- */
.aviso{
  display:flex;gap:9px;align-items:flex-start;border:1px solid var(--cor,var(--linha));
  border-left:3px solid var(--cor,var(--neutro));background:var(--carta);border-radius:var(--raio-p);
  padding:9px 12px;font-size:12.5px;margin-bottom:10px;
}
.aviso .marca{font-weight:600;color:var(--cor)}
.aviso.alerta{--cor:var(--alerta)} .aviso.risco{--cor:var(--risco)}
.aviso.nota{--cor:var(--ardosia)} .aviso.bom{--cor:var(--ok)}
.apr-cadeia{display:flex;align-items:center;flex-wrap:wrap;row-gap:8px}
.apr-elo{padding:6px 13px;border-radius:99px;font-size:11.5px;font-weight:600;letter-spacing:.03em;border:1px solid var(--cor);
  color:var(--cor);background:color-mix(in srgb,var(--cor) 8%,var(--carta))}
.apr-elo.final{background:var(--cor);color:var(--carta)}
html[data-tema="escuro"] .apr-elo.final{color:#14171b}
.apr-elo.mono{font-family:"IBM Plex Mono",monospace;font-weight:500;letter-spacing:0}
.apr-seta{color:var(--tinta-3);padding:0 4px;display:grid;place-items:center}
/* ---------- Manual ---------- */
.manual{display:grid;grid-template-columns:266px minmax(0,1fr);gap:18px;align-items:start}
.manual-indice{position:sticky;top:var(--topo-alt,110px);max-height:calc(100vh - var(--topo-alt,110px) - 16px);overflow:auto;
  background:var(--carta);border:1px solid var(--linha);border-radius:var(--raio);box-shadow:var(--sombra);padding:12px}
.manual-indice .busca{width:100%;padding:6px 9px;border:1px solid var(--linha);border-radius:var(--raio-p);background:var(--carta-2);margin-bottom:8px}
.manual-indice .grupo{margin-top:10px}
.manual-indice .grupo > h4{font-size:12px;color:var(--cor);display:flex;gap:6px;align-items:center;margin-bottom:5px}
.ind-item{display:block;width:100%;appearance:none;border:0;border-left:2px solid transparent;background:transparent;text-align:left;
  font-size:12px;color:var(--tinta-2);padding:4px 8px;border-radius:0 var(--raio-p) var(--raio-p) 0;cursor:pointer}
.ind-item:hover{background:var(--papel-2);color:var(--tinta)}
.ind-item.ativo{border-left-color:var(--cor);color:var(--cor);background:color-mix(in srgb,var(--cor) 8%,var(--carta));font-weight:600}
.ind-item .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--tinta-3);margin-right:5px}
.man-parte{border-radius:var(--raio);padding:16px 18px;margin-bottom:14px;border:1px solid color-mix(in srgb,var(--cor) 32%,var(--linha));
  background:linear-gradient(120deg,color-mix(in srgb,var(--cor) 11%,var(--carta)),var(--carta) 70%);display:flex;gap:14px;align-items:center}
.man-parte .icone-fase{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--cor);color:var(--carta);flex:0 0 auto}
html[data-tema="escuro"] .man-parte .icone-fase{color:#14171b}
.man-parte h2{font-size:19px;color:var(--cor)}
.man-parte p{margin:3px 0 0;font-size:12.5px;color:var(--tinta-2);max-width:78ch}
.man-secao{scroll-margin-top:calc(var(--topo-alt,110px) + 10px)}
.man-secao p,.man-secao li{font-size:13px;line-height:1.6;color:var(--tinta-2);max-width:92ch}
.man-secao p{margin:0 0 8px}
.man-secao ol,.man-secao ul{margin:0 0 8px;padding-left:20px}
.man-secao code,.man-quad code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--papel-2);border:1px solid var(--linha);border-radius:4px;padding:0 4px;color:var(--tinta)}
.man-passo-cab{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.man-num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;
  background:color-mix(in srgb,var(--acento) 14%,var(--carta));color:var(--acento);border:1px solid color-mix(in srgb,var(--acento) 40%,var(--linha));flex:0 0 auto}
.man-onde{font-size:11.5px;color:var(--tinta-3)}
.man-quads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.man-quad{border:1px solid var(--linha);border-left:3px solid var(--cor);border-radius:var(--raio-p);padding:9px 12px;background:color-mix(in srgb,var(--cor) 4%,var(--carta))}
.man-quad h5{margin:0 0 5px;font-size:12px;color:var(--cor);font-family:"IBM Plex Sans",sans-serif;font-weight:600}
.man-quad ul{margin:0;padding-left:17px}
.man-quad li{font-size:12.5px;line-height:1.55;color:var(--tinta-2)}
pre.codigo{position:relative;margin:6px 0 10px;background:var(--papel-2);border:1px solid var(--linha);border-radius:var(--raio-p);
  padding:11px 13px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.55;overflow:auto;white-space:pre;color:var(--tinta)}
pre.codigo .copiar{position:absolute;top:6px;right:6px}
.man-vivo{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.man-tab{max-height:none}
.man-tab td{vertical-align:top}
@media(max-width:1060px){.manual{grid-template-columns:1fr}.manual-indice{position:static;max-height:none}.man-quads{grid-template-columns:1fr}}
/* ---------- Página do manual ---------- */
.oculto{display:none!important}
.topo-linha .sub b{color:var(--cor-versao);font-weight:600}
.versoes{display:flex;gap:2px;padding:3px;border:1px solid var(--linha);border-radius:99px;background:var(--carta-2)}
.versoes button{appearance:none;border:0;background:transparent;font:inherit;font-size:12px;color:var(--tinta-3);padding:4px 12px;border-radius:99px;cursor:pointer}
.versoes button:hover{color:var(--tinta)}
.versoes button[aria-pressed="true"]{background:var(--cor-versao);color:var(--carta);font-weight:600}
html[data-tema="escuro"] .versoes button[aria-pressed="true"]{color:#14171b}
.versoes button:focus-visible{outline:2px solid var(--cor-versao);outline-offset:1px}
.selo-versao{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:"IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.05em;
  color:var(--cor-versao);border:1px solid color-mix(in srgb,var(--cor-versao) 45%,var(--linha));border-radius:99px;padding:2px 9px;margin-left:8px;vertical-align:middle}
.man-secao h3{font-size:15px}
.man-regras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.man-regra{border:1px solid var(--linha);border-left:3px solid var(--cor);border-radius:var(--raio-p);padding:10px 12px;background:color-mix(in srgb,var(--cor) 4%,var(--carta))}
.man-regra h4{color:var(--cor);font-size:13.5px;margin-bottom:4px;display:flex;gap:8px;align-items:baseline}
.man-regra h4 small{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--tinta-3);font-weight:500}
.man-regra p{font-size:12.5px!important;margin:0 0 5px!important}
.man-regra .acao{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--cor);letter-spacing:.02em}
.man-regra .vivo{font-size:12px!important;color:var(--tinta-3)!important;border-top:1px dashed var(--linha);padding-top:6px;margin-top:6px!important;white-space:pre-line}
.tab-versoes td:nth-child(2),.tab-versoes td:nth-child(3){white-space:nowrap}
.sim{color:var(--ok);font-weight:600}.nao{color:var(--tinta-3)}
.aviso .ligacao{margin-left:auto}
@media(max-width:900px){.man-quads{grid-template-columns:1fr}.man-regras{grid-template-columns:1fr}}
@media(max-width:760px){.topo-linha{flex-wrap:wrap}.topo-acoes{margin-left:0}main{padding:14px 16px}}
@media print{
  .topo,.manual-indice,.man-acoes,.copiar,.aviso.sem-ligacao{display:none!important}
  .manual{display:block}
  .bloco,.man-quad,.man-regra{box-shadow:none;break-inside:avoid-page}
  pre.codigo{white-space:pre-wrap}
  body{background:#fff}
}

</style>
</head>
<body>
<header class="topo">
  <div class="topo-linha">
    <div class="brasao" aria-hidden="true">W</div>
    <div class="titulo-bloco">
      <h1>Manual · Módulo de Saneamento da base de Projetos MAPP <span class="selo-versao" id="versaoNome">Versão completa</span></h1>
      <span class="sub">Guia de operação, conceitos e regras — o conteúdo acompanha a versão do sistema que abriu o manual</span>
    </div>
    <div class="topo-acoes">
      <div class="versoes" role="group" aria-label="Versão do sistema">
        <button type="button" data-versao="completa" aria-pressed="true" title="Mostra o manual da versão completa (index.html).">Completa</button>
        <button type="button" data-versao="essencial" aria-pressed="false" title="Mostra o manual da versão essencial (simplificado/index.html).">Essencial</button>
      </div>
      <button class="btn discreto" id="btnImprimir" title="Abre a impressão do navegador apenas com o manual; escolha “Salvar como PDF” para gerar o arquivo.">Imprimir</button>
      <button class="btn discreto" id="btnTema" aria-pressed="false" title="Alterna entre o tema claro e o escuro.">Tema</button>
    </div>
  </div>
</header>
<main style="--acento:var(--ferrugem);--acento-tenue:rgba(138,82,64,.10);--acento-medio:rgba(138,82,64,.3)">
  <div class="manual">
    <aside class="manual-indice" id="manualIndice" aria-label="Índice do manual"></aside>
    <div class="manual-conteudo" id="manualConteudo"></div>
  </div>
</main>
<script>
"use strict";
/* ==========================================================================
   Manual único do Módulo de Saneamento da base de Projetos MAPP
   Servido às duas versões do sistema: a completa (index.html) e a essencial
   (simplificado/index.html). A versão é resolvida, em ordem, pelo parâmetro
   ?versao= que o sistema passa ao abrir o manual, pelo endereço de origem e,
   na falta de ambos, pela versão completa. Cada seção declara a que versão
   pertence: 'ambas', 'completa' ou 'essencial'.

   Quando aberto pelo botão Manual do sistema, o manual conversa com a janela
   de origem por postMessage: recebe os números da sessão e os textos das
   regras com os parâmetros em vigor, e pede ao sistema que abra a tela de
   cada passo. Aberto isoladamente, funciona como documento estático.
   ========================================================================== */

const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function norm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
/* Texto com marcação mínima: `código` e **negrito**. */
function fmtTexto(s){
  return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
}

function tip(texto,titulo){ return ' title="'+esc((titulo?titulo+' — ':'')+texto)+'"'; }

const VERSOES = {
  completa:  { nome:'Versão completa',  cor:'var(--ferrugem)', sistema:'index.html' },
  essencial: { nome:'Versão essencial', cor:'var(--musgo)',    sistema:'simplificado/index.html' }
};
function versaoInicial(){
  const q=new URLSearchParams(location.search).get('versao');
  if(VERSOES[q]) return q;
  if(/\/simplificado\//.test(document.referrer||'')) return 'essencial';
  return 'completa';
}
let VERSAO = versaoInicial();
const VERSAO_ORIGEM = versaoInicial();   // versão que abriu o manual
let ESTADO = null;           // números da sessão enviados pelo sistema
const ORIGEM = (function(){ try{ return window.opener && !window.opener.closed ? window.opener : null; }catch(e){ return null; } })();
function destinoMensagem(){ return location.protocol==='file:' ? '*' : location.origin; }
function origemAceita(o){ return o===location.origin || (location.protocol==='file:' && o==='null'); }
function avisarSistema(msg){
  if(!ORIGEM) return false;
  try{ msg.fonte='webmapp-manual'; ORIGEM.postMessage(msg,destinoMensagem()); return true; }catch(e){ return false; }
}
window.addEventListener('message',function(ev){
  if(!origemAceita(ev.origin) || !ev.data || ev.data.fonte!=='webmapp' || ev.data.tipo!=='estado') return;
  ESTADO=ev.data;
  renderSituacao();
  renderRegrasVivas();

});

      '<p>'+fmtTexto('**Retorno.** `importarRetornos` lê cada arquivo com o SheetJS, localiza a rodada pelo CONTROLE (nunca pelo nome), confere o token de cada linha e as exigências da regra, mostra a conferência em `perguntar` e, confirmada, `aplicarRetornos` grava `E.manifestacoes`, lança na auditoria e atualiza os retornos da rodada.')+'</p>'+
      '<p>'+fmtTexto('**Sessão formato 2.** `gravarSessao` incrementa `E.versaoSessao`, nomeia `DDMMAAAA-HHMM-Vnn.json` e grava no destino escolhido; `aplicarSessao` aceita os formatos 1 e 2 e avisa quando `assinaturaBase` não bate com a base importada.')+'</p>'+
      codigo("{ formato:2, versao:3, nome:'23092026-1435-V03.json', assinaturaBase:'…',\n  cfg, decisoes, exclusoes, encerramento, auditoria, responsavel, seq, npAnos,\n  rodadas:[{ id, versao, geradaEm, prazoDias, dataLimite,\n    orgaos:[{ orgao, arquivo, itens:{ chave: regra }, hash, retornos:[] }] }],\n  manifestacoes:{ chave:{ rodada, orgao, regra, resposta, sentido, justificativa,\n    previsao, responsavelOrgao, dataOrgao, arquivo, intempestiva, pendencias, historico } },\n  cfgSessao:{ destino, github:{ repo, branch, pasta } } }")+
      '<p>'+fmtTexto('**GitHub.** `githubGravar` usa `PUT /repos/{dono}/{repo}/contents/{pasta}/{arquivo}` com o conteúdo em base64; cada versão é um arquivo novo. `githubListar` e `githubLer` (`Accept: application/vnd.github.raw`) servem a **Retomar sessão**. O token vem de Configurações ou do diálogo `pedirAcessoGitHub`, fica em `E.github.token` e, só se o usuário marcar, em `localStorage` (`webmapp-saneamento-github`). A geração exige sessão ativa (`sessaoAtiva`); **Baixar de novo** (`reemitirRodada`) refaz as planilhas de uma rodada com as regras gravadas nela.')+'</p>';
  }},
  { id:'t-conv', t:'Convenções de trabalho e de interface', cor:'var(--sepia)', html:function(){
    return '<ul>'+[
      'Alterações cirúrgicas, por substituição de trechos; cada entrega vai em commit próprio no repositório.',
      'Apresentar o entendimento antes de implementar alterações não triviais.',
      'Nunca refatorar identificadores quando só o rótulo muda.',
      'Vocabulário culto e sóbrio; nada de jargão.',
      'Paleta discreta: grafite, latão, musgo, ardósia, ferrugem, ameixa, ocre, carmim, petróleo, sépia. Tipografia IBM Plex (Sans, Serif, Mono).',
      'Abas, cartões e blocos diferenciados por cor; tema claro e escuro alternáveis.',
      'Dicas obrigatórias em botões (o que fazem), em campos com cálculo (a fórmula) e em toda etiqueta com significado.',
      'Gráficos dinâmicos (Chart.js) com botões de alternância.',
      'Nada de campos numéricos com setas: usar listas suspensas. Filtros em seleção múltipla.',
      'Todas as colunas de todas as grades são ordenadoras.',
      'Nenhuma alteração automática: toda decisão é humana, imediata e auditada com o responsável.',
      'Manual único em `manual.html`: todo texto novo declara a versão a que pertence (`ambas`, `completa` ou `essencial`).'
    ].map(function(x){ return '<li>'+fmtTexto(x)+'</li>'; }).join('')+'</ul>';
  }},
  { id:'t-valid', t:'Validação e ensaio', cor:'var(--carmim)', html:function(){
    return '<p>Antes de cada entrega: sintaxe de todos os blocos de script e balanceamento de etiquetas.</p>'+
      codigo("python3 - <<'PY'\nimport re, subprocess\nh = open('index.html', encoding='utf-8').read()\nfor i, b in enumerate(re.findall(r'<script>(.*?)<\/script>', h, re.S), 1):\n    open(f'bloco{i}.js', 'w').write(b)\n    r = subprocess.run(['node', '--check', f'bloco{i}.js'], capture_output=True, text=True)\n    print(i, 'ok' if r.returncode == 0 else r.stderr)\ncorpo = re.sub(r'<script.*?<\/script>|<style.*?<\/style>', '', h, flags=re.S)\nfor t in ['div', 'section', 'table', 'aside', 'button']:\n    print(t, len(re.findall(f'<{t}[ >]', corpo)), len(re.findall(f'</{t}>', corpo)))\nPY")+
      '<p>'+fmtTexto('Repetir a verificação em `simplificado/index.html` e em `manual.html` quando forem alterados.')+'</p>'+
      '<p>'+fmtTexto('Ensaio com a base real em Node, com `jsdom` e `xlsx`. As bibliotecas de CDN não sobem no `jsdom`; o código tolera a ausência do Chart.js. O parse leva cerca de 10 s: rodar uma vez por lote e imprimir só o resumo.')+'</p>'+
      codigo("const fs = require('fs'), { JSDOM } = require('jsdom'), XLSX = require('xlsx');\nconst dom = new JSDOM(fs.readFileSync('index.html', 'utf8'),\n  { runScripts: 'dangerously', pretendToBeVisual: true });\nconst w = dom.window;\nconst wb = XLSX.read(fs.readFileSync('mapps-regis18-09.xlsx'),\n  { type: 'buffer', cellDates: true, dense: true, sheets: ['Base de Dados'] });\nconst linhas = XLSX.utils.sheet_to_json(wb.Sheets['Base de Dados'],\n  { header: 1, raw: true, defval: null, blankrows: false });\nw.montarBase(linhas, 'Base de Dados'); w.consolidar(); w.diagnosticar(); w.renderTudo();\nconst E = w.eval('E'), d = E.diag;\nconsole.log({ linhas: E.linhas.length, mapps: E.mapps.length, universo: d.noUniverso.length,\n  r1a: d.regras['1a'].length, r1b: d.regras['1b'].length,\n  r12: d.regras['1.2'].length, r13: d.regras['1.3'].length });");
  }},
  { id:'t-ref', t:'Números de referência e limitações', cor:'var(--ocre)', html:function(){
    return '<p>'+fmtTexto('Extração de 18/09/2026 (`mapps-regis18-09.xlsx`), âncora automática em 2026 e critério de empenho. Servem de sanidade, não de meta.')+'</p>'+
      tabela(['Grandeza','Valor'],[
        ['Linhas úteis','31.177'],['MAPPs consolidados','21.463'],['Universo de saneamento','6.473'],
        ['Regra 1 (item 1.a)','796'],['Regra 2 (item 1.b)','688'],['Regra 3 (item 1.2)','2.455'],['Regra 4 (item 1.3)','538'],['União das regras','4.014'],
        ['Saldo do programado no exercício corrente','R$ 12,06 bi'],
        ['Novo Programado 2027 — base integral, anos 2025 e 2026','R$ 18,15 bi (1 inconsistência)']
      ],'manTabRef')+
      '<h4 style="margin:10px 0 6px">Limitações conhecidas</h4><ul>'+[
      'A base não traz percentual de execução física; a regra 4 apoia-se exclusivamente no estágio registrado.',
      'O indicador `Sem Exec 23-26` cobre faixa fixa; fora dela o cotejo é suspenso, sem acusar inconsistência.',
      'A proteção das planilhas dos órgãos evita alteração acidental, mas não é segurança: a autenticidade de cada linha vem do token conferido na importação.',
      'Os retornos só são aceitos com a sessão da rodada (ou posterior) retomada, pois é ela que registra a rodada.',
      'Sem persistência do trabalho no navegador: ele só se conserva pela sessão em .json, gravada no computador ou no GitHub.',
      'Sem conexão, as bibliotecas de CDN não carregam e a importação fica indisponível.',
      'O manual mostra os números da sessão e o atalho “Ir para a tela” apenas quando aberto pelo botão Manual do sistema.'
      ].map(function(x){ return '<li>'+fmtTexto(x)+'</li>'; }).join('')+'</ul>';
  }}
];

/* Parâmetros em vigor: vêm do sistema de origem; sem ligação, fica a referência oficial. */
function htmlParametros(){
  const intro='<p>'+fmtTexto('Cada MAPP é submetido a `avaliar(m)`, que usa `executou(m,ini,fim)` segundo o critério de `E.cfg.criterio` e o tratamento `E.cfg.baseValor`. O universo é decidido por `noUniverso(m)`. As regras citam posições relativas: `aplicarAncora` resolve ano corrente e ano anterior a partir do relógio, limitado ao último exercício com execução na base (`anoCorrenteEfetivo`).')+'</p>'+
    '<p>'+fmtTexto('Os textos explicativos de cada regra são compostos por `dicaRegra(id)` com os parâmetros em vigor, de modo que as dicas acompanhem qualquer alteração de configuração. O padrão das regras está em `CFG_OFICIAL`.')+'</p>';
  if(!ESTADO || !ESTADO.parametros)
    return intro+'<div class="aviso nota sem-ligacao"><span class="marca">Parâmetros</span><span>Abra o manual pelo botão Manual do sistema para ver aqui a tabela de parâmetros em vigor ao lado dos valores oficiais.</span></div>';
  return intro+tabela(['Parâmetro','Em vigor','Valor oficial'],ESTADO.parametros,'manTabCfg');
}

/* ------------------------------ Renderização ----------------------------- */

function secao(s,grupo){
  return '<div class="bloco man-secao" id="man-'+s.id+'" data-man-grupo="'+grupo+'" style="--acento:'+s.cor+'">'+
    '<header><h2>'+esc(s.t)+'</h2></header><div class="man-corpo">'+s.html()+'</div></div>';
}
function parte(cor,ic,titulo,texto){
  return '<div class="man-parte" style="--cor:'+cor+'"><span class="icone-fase">'+icone(ic,24)+'</span><div>'+
    '<h2>'+esc(titulo)+'</h2><p>'+esc(texto)+'</p></div></div>';
}
function tecnicoAtual(){ return VERSAO==='completa' ? TECNICO : []; }
function conceitosAtuais(){ return CONCEITOS.filter(function(s){ return s.v==='ambas'||s.v===VERSAO; }); }

function renderManual(){
  const V=VERSOES[VERSAO];
  document.documentElement.style.setProperty('--cor-versao',V.cor);
  document.title='Manual · '+V.nome+' · Saneamento de MAPPs';
  $('#versaoNome').textContent=V.nome;
  $$('.versoes button').forEach(function(b){ b.setAttribute('aria-pressed',b.getAttribute('data-versao')===VERSAO?'true':'false'); });

  const guia=guiaAtual(), tec=tecnicoAtual(), conc=conceitosAtuais();
  $('#manualConteudo').innerHTML=
    '<div class="bloco man-secao" id="man-situacao" data-man-grupo="abertura" style="--acento:var(--cor-versao)">'+
      '<header><h2>Situação desta sessão</h2><span class="legenda" id="manualVivoLegenda"></span></header>'+
      '<div id="manualVivo"></div>'+
      '<div style="margin-top:12px">'+cadeiaPrincipio()+'</div>'+
    '</div>'+
    parte('var(--ardosia)','bussola','Parte I · Guia de operação',
      VERSAO==='essencial'
        ? 'Passo a passo da versão essencial, na ordem das três etapas do sistema, com o que fazer, o que conferir e as cautelas de cada uma.'
        : 'Passo a passo do trabalho de saneamento na versão completa, na ordem do rito, com o que fazer, o que conferir e as cautelas de cada etapa.')+
    guia.map(htmlPasso).join('')+
    parte('var(--latao)','balanca','Parte II · Conceitos e regras','As regras de saneamento, a grandeza monetária com que o sistema trabalha, a comparação entre as versões e o glossário.')+
    conc.map(function(s){ return secao(s,'conceitos'); }).join('')+
    (tec.length
      ? parte('var(--ferrugem)','codigo','Parte III · Manual técnico','Referência para evolução e manutenção: arquitetura, estado, fluxo de funções, motor de regras, componentes, receitas de extensão, convenções e ensaios.')+
        tec.map(function(s){ return secao(s,'tecnico'); }).join('')
      : '');

  const grupo=function(titulo,cor,ic,itens){
    return '<div class="grupo" style="--cor:'+cor+'"><h4>'+icone(ic,14)+esc(titulo)+'</h4>'+itens.map(function(it){
      return '<button type="button" class="ind-item" style="--cor:'+cor+'" data-man-alvo="'+it[0]+'"'+tip('Rola o manual até esta seção.',it[1])+'>'+
        (it[2]?'<span class="n">'+it[2]+'</span>':'')+esc(it[1])+'</button>';
    }).join('')+'</div>';
  };
  $('#manualIndice').innerHTML=
    '<input type="search" class="busca" id="manualBusca" placeholder="Localizar no manual…" aria-label="Localizar no manual"'+
      tip('Filtra as seções do manual que contêm o termo digitado. Apague o termo para exibir todas.','Localizar')+'>'+
    grupo('Abertura','var(--cor-versao)','livro',[['man-situacao','Situação desta sessão','']])+
    grupo('Parte I · Guia de operação','var(--ardosia)','bussola',guia.map(function(p,i){ return ['man-g'+(i+1),p.t,String(i+1).padStart(2,'0')]; }))+
    grupo('Parte II · Conceitos e regras','var(--latao)','balanca',conc.map(function(s,i){ return ['man-'+s.id,s.t,'C'+(i+1)]; }))+
    (tec.length?grupo('Parte III · Manual técnico','var(--ferrugem)','codigo',tec.map(function(s,i){ return ['man-'+s.id,s.t,'T'+(i+1)]; })):'');
  renderSituacao();
  renderRegrasVivas();
  vigiarSecoes();
}

function cartaoMan(c){
  return '<div class="cartao" style="--cor:'+c[2]+'"'+(c[3]?tip(c[3],c[0]):'')+'><div class="rotulo">'+esc(c[0])+'</div><div class="valor">'+esc(c[1])+'</div></div>';
}
function renderSituacao(){
  const alvo=$('#manualVivo'); if(!alvo) return;
  const leg=$('#manualVivoLegenda');
  if(!ORIGEM){
    alvo.innerHTML='<div class="aviso nota sem-ligacao"><span class="marca">Situação</span><span>Manual aberto fora do sistema. Pelo botão <b>Manual</b>, no alto do sistema, esta seção mostra os números da sessão e cada passo ganha o atalho “Ir para a tela”.</span></div>';
    if(leg) leg.textContent=''; return;
  }
  if(!ESTADO){
    alvo.innerHTML='<div class="aviso nota"><span class="marca">Situação</span><span>Aguardando os números da sessão enviados pelo sistema…</span></div>';
    if(leg) leg.textContent=''; return;
  }
  if(ESTADO.versao && ESTADO.versao!==VERSAO){
    alvo.innerHTML='<div class="aviso nota"><span class="marca">Situação</span><span>Os números da sessão aberta são da '+esc(VERSOES[ESTADO.versao].nome.toLowerCase())+'. Volte a ela no seletor do alto para vê-los aqui.</span></div>';
    if(leg) leg.textContent=''; return;
  }
  if(leg) leg.textContent=ESTADO.legenda||'';
  alvo.innerHTML=ESTADO.base
    ? '<div class="man-vivo">'+ESTADO.cartoes.map(cartaoMan).join('')+'</div>'
    : '<div class="aviso nota"><span class="marca">Situação</span><span>Nenhuma base carregada nesta sessão. Os números surgem aqui depois da importação.</span></div>';
}
function renderRegrasVivas(){
  $$('[data-regra-viva]').forEach(function(p){
    const txt=ESTADO && ESTADO.versao===VERSAO && ESTADO.regras ? ESTADO.regras[p.getAttribute('data-regra-viva')] : '';
    p.textContent=txt?('Com os parâmetros desta sessão: '+txt):'';
    p.classList.toggle('oculto',!txt);
  });
}

/* Realce, no índice, da seção visível. */
let _vigia=null;
function vigiarSecoes(){
  if(typeof IntersectionObserver==='undefined') return;
  if(_vigia) _vigia.disconnect();
  _vigia=new IntersectionObserver(function(ents){
    ents.forEach(function(en){
      if(!en.isIntersecting) return;
      $$('#manualIndice .ind-item').forEach(function(b){ b.classList.toggle('ativo', b.getAttribute('data-man-alvo')===en.target.id); });
    });
  },{rootMargin:'-30% 0px -60% 0px'});
  $$('#manualConteudo .man-secao').forEach(function(s){ _vigia.observe(s); });
}

function filtrarManual(termo){
  const t=norm(termo);
  $$('#manualConteudo .man-secao').forEach(function(s){
    const ok=!t || norm(s.textContent).indexOf(t)>=0;
    s.classList.toggle('oculto',!ok);
    const b=$('#manualIndice [data-man-alvo="'+s.id+'"]'); if(b) b.classList.toggle('oculto',!ok);
  });
  $$('#manualConteudo .man-parte').forEach(function(p){ p.classList.toggle('oculto',!!t); });
}

function copiarTexto(txt,botao){
  const ok=function(){ if(botao){ const r=botao.textContent; botao.textContent='Copiado'; setTimeout(function(){ botao.textContent=r; },1200); } };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok,function(){ copiaReserva(txt); ok(); }); return; }
  copiaReserva(txt); ok();
}
function copiaReserva(txt){
  const a=document.createElement('textarea'); a.value=txt; a.style.position='fixed'; a.style.opacity='0';
  document.body.appendChild(a); a.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(a);
}

function trocarVersao(v){
  if(!VERSOES[v] || v===VERSAO) return;
  VERSAO=v;
  try{ const u=new URL(location.href); u.searchParams.set('versao',v); history.replaceState(null,'',u); }catch(e){}
  const bx=$('#manualBusca'); if(bx) bx.value='';
  renderManual();
  window.scrollTo({top:0});
}
function alternarTema(){
  const r=document.documentElement;
  r.setAttribute('data-tema',r.getAttribute('data-tema')==='escuro'?'claro':'escuro');
  $('#btnTema').setAttribute('aria-pressed',r.getAttribute('data-tema')==='escuro'?'true':'false');
}
function ajustarTopo(){
  const t=$('.topo'); if(t) document.documentElement.style.setProperty('--topo-alt',(t.offsetHeight+14)+'px');
}

function iniciar(){
  if(new URLSearchParams(location.search).get('tema')==='escuro'){
    document.documentElement.setAttribute('data-tema','escuro'); $('#btnTema').setAttribute('aria-pressed','true');
  }
  ajustarTopo();
  renderManual();
  $('#btnTema').addEventListener('click',alternarTema);
  $('#btnImprimir').addEventListener('click',function(){ filtrarManual(''); const bx=$('#manualBusca'); if(bx) bx.value=''; window.print(); });
  $$('.versoes button').forEach(function(b){ b.addEventListener('click',function(){ trocarVersao(b.getAttribute('data-versao')); }); });
  $('#manualIndice').addEventListener('input',function(ev){ if(ev.target.id==='manualBusca') filtrarManual(ev.target.value); });
  document.addEventListener('click',function(ev){
    const alvo=ev.target.closest('[data-man-alvo]');
    if(alvo){ const s=document.getElementById(alvo.getAttribute('data-man-alvo')); if(s) s.scrollIntoView({behavior:'smooth',block:'start'}); return; }
    const ir=ev.target.closest('[data-man-ir]');
    if(ir){ avisarSistema({tipo:'ir',versao:VERSAO,destino:ir.getAttribute('data-man-ir').split('|')}); return; }
    const cp=ev.target.closest('.copiar');
    if(cp){ const c=cp.parentElement.querySelector('code'); if(c) copiarTexto(c.textContent,cp); }
  });
  window.addEventListener('resize',ajustarTopo);
  avisarSistema({tipo:'pronto',versao:VERSAO});
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',iniciar); else iniciar();

</script>
